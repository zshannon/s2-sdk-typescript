name: Sync upstream main

on:
  schedule:
    - cron: "0 9 * * 2"
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  cancel-in-progress: false
  group: sync-upstream-main

jobs:
  open-pull-request:
    if: github.repository == 'zshannon/s2-sdk-typescript' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or reuse upstream pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const base = 'main';
            const head = 's2-streamstore:main';
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              basehead: `${base}...${head}`, owner, per_page: 1, repo,
            });
            if (comparison.data.ahead_by === 0) {
              core.info('No upstream commits need merging.');
              return;
            }

            const open = await github.paginate(github.rest.pulls.list, {
              base, head, owner, per_page: 100, repo, state: 'open',
            });
            const existing = open.find(pr => pr.head.repo?.full_name === 's2-streamstore/s2-sdk-typescript');
            if (existing) {
              core.info(`Upstream pull request already open: ${existing.html_url}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              base,
              body: [
                'Merge the latest `s2-streamstore/s2-sdk-typescript:main` changes into this fork.',
                '',
                'Opened by the Tuesday 09:00 America/Los_Angeles sync. This PR tracks upstream main directly and is reused while open; the workflow never resets main or merges automatically.',
                '',
                'Review the changes, including workflow changes, then select **Approve workflows to run** in the PR merge box when GitHub requests approval. PRs created with GITHUB_TOKEN have approval-required CI runs; all required checks must pass before merging.',
                '',
                'The upstream head cannot be edited by fork maintainers. If there are conflicts, follow the [fork integration branch instructions](https://github.com/zshannon/s2-sdk-typescript/blob/main/DEVELOPMENT.md#conflicting-upstream-changes). Keep this tracking PR open while reviewing the replacement integration PR, so the weekly check reuses it.',
                '',
                'Use a merge commit to retain upstream ancestry, so later syncs contain only new upstream commits. Preserve the fork PKI behavior, published Biscuit dependency, and `@zshannon/streamstore`, `@zshannon/streamstore-patterns`, and `@zshannon/resumable-stream` package names and release configuration.',
              ].join('\n'),
              head,
              maintainer_can_modify: false,
              owner,
              repo,
              title: 'chore(upstream): merge upstream main',
            });
            core.info(`Opened upstream pull request: ${pr.html_url}`);
